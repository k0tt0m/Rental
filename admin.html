<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Админ-панель — Аренда квартиры</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .admin-container {
      width: min(900px, 92%);
      margin: 40px auto;
    }

    .admin-header {
      margin-bottom: 30px;
    }

    .admin-header h1 {
      margin-bottom: 8px;
    }

    .admin-header p {
      color: #666;
    }

    .admin-card {
      background: white;
      padding: 30px;
      margin-bottom: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .admin-card h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    .price-input {
      max-width: 300px;
    }

    .photo-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .photo-item {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 10px;
      background: #fafafa;
    }

    .photo-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .save-message {
      margin-top: 15px;
      font-weight: bold;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 25px;
      color: #222;
      text-decoration: none;
    }

    @media (max-width: 700px) {
      .admin-card {
        padding: 22px;
      }

      .photo-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="admin-container">

    <a href="index.html" class="back-link">
      ← Вернуться на сайт
    </a>

    <header class="admin-header">
      <h1>Админ-панель</h1>
      <p>Управление квартирой</p>
    </header>

    <section class="admin-card">

      <h2>Информация о квартире</h2>

      <label for="apartment-title">
        Заголовок
      </label>

      <input
        type="text"
        id="apartment-title"
        placeholder="Аренда квартиры в Санкт-Петербурге"
      >

      <label for="apartment-description">
        Описание
      </label>

      <textarea
        id="apartment-description"
        placeholder="Введите описание квартиры..."
      ></textarea>

    </section>

    <section class="admin-card">

      <h2>Стоимость</h2>

      <label for="price-per-night">
        Цена за сутки, ₽
      </label>

      <input
        type="number"
        id="price-per-night"
        class="price-input"
        min="0"
        placeholder="3000"
      >

    </section>

    <section class="admin-card">

      <h2>Фотографии</h2>

      <p>
        Укажи ссылки на фотографии квартиры.
      </p>

      <div class="photo-list">

        <div class="photo-item">

          <img
            id="preview-photo-1"
            src="https://via.placeholder.com/400x250"
            alt="Фото 1"
          >

          <input
            type="url"
            id="photo-1"
            placeholder="Ссылка на фото"
          >

        </div>

        <div class="photo-item">

          <img
            id="preview-photo-2"
            src="https://via.placeholder.com/400x250"
            alt="Фото 2"
          >

          <input
            type="url"
            id="photo-2"
            placeholder="Ссылка на фото"
          >

        </div>
